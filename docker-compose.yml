services:
  db:
    image: postgres:16-alpine
    container_name: inventario_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventario}
      POSTGRES_USER: ${POSTGRES_USER:-inventario_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventario_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inventario_user} -d ${POSTGRES_DB:-inventario}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inventario_backend
    restart: unless-stopped
    command: ["sh", "/app/entrypoint.sh"]
    environment:
      DEBUG: "${DEBUG:-True}"
      SECRET_KEY: "${SECRET_KEY:-dev-secret-key-change-me}"
      DATABASE_URL: "${DATABASE_URL:-postgres://inventario_user:inventario_pass@db:5432/inventario}"
      DATABASE_SSL_REQUIRE: "${DATABASE_SSL_REQUIRE:-False}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
      EMAIL_BACKEND: "${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}"
      EMAIL_HOST: "${EMAIL_HOST:-localhost}"
      EMAIL_PORT: "${EMAIL_PORT:-1025}"
      EMAIL_HOST_USER: "${EMAIL_HOST_USER:-}"
      EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD:-}"
      EMAIL_USE_TLS: "${EMAIL_USE_TLS:-False}"
      EMAIL_USE_SSL: "${EMAIL_USE_SSL:-False}"
      DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL:-no-reply@armada.local}"
      SEED_DEV_DATA_100: "${SEED_DEV_DATA_100:-true}"
      SEED_DEV_COUNT: "${SEED_DEV_COUNT:-100}"
      SEED_DEV_RESET: "${SEED_DEV_RESET:-false}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-3}"
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/docs/', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inventario_frontend
    restart: unless-stopped
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      VITE_API_URL: "${VITE_API_URL:-http://localhost:8001/api/v1}"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173 >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 25s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  backend_media:
